<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dagens tidslinje</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #14161c;
    color: #e8e8ec;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  #clock { font-variant-numeric: tabular-nums; font-size: 15px; color: #8a8d99; }

  .addBar { display: flex; gap: 8px; }
  .addBar input {
    flex: 1;
    background: #1c1f27;
    border: 1px solid #303441;
    color: #e8e8ec;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 14px;
  }
  .addBar input:focus { outline: none; border-color: #4c7cf0; }
  .addBar button {
    background: #4c7cf0;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .addBar button:hover { background: #3f6ce0; }

  .error {
    min-height: 18px;
    font-size: 12.5px;
    color: #ff9a9a;
    margin-top: 6px;
    opacity: 0;
    transition: opacity .15s;
  }
  .error.show { opacity: 1; }

  .hint { font-size: 12px; color: #6b6e79; margin-top: 2px; margin-bottom: 16px; }
  .hint code { background: #1c1f27; padding: 1px 5px; border-radius: 4px; color: #b6b8c2; }

  .statusRow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .statusCard {
    flex: 1 1 140px;
    background: #1c1f27;
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .statusCard .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b6e79; }
  .statusCard span:last-child:not(.label) { font-size: 13.5px; }
  #nowCard span:last-child { color: #7ee08b; font-weight: 600; }

  button.ghost {
    background: #1c1f27;
    color: #b6b8c2;
    border: 1px solid #303441;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.ghost:hover { background: #262a35; }
  button.ghost.danger:hover { background: #3a1f1f; color: #ff9a9a; }

  .alarmBanner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #3a2f14;
    border: 1px solid #6b5420;
    color: #ffd98a;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 600;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .alarmBanner.hidden { display: none; animation: none; }
  .alarmBanner button {
    background: #6b5420;
    color: #ffe9b8;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 217, 138, .35); }
    50% { box-shadow: 0 0 0 6px rgba(255, 217, 138, 0); }
  }

  .timelineScroll {
    height: min(68vh, 640px);
    overflow-y: auto;
    background: #1c1f27;
    border-radius: 10px;
    border: 1px solid #262a35;
  }
  .timelineTrack {
    position: relative;
    width: 100%;
  }
  .hourLine {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px solid #262a35;
    height: 0;
  }
  .hourLabel {
    position: absolute;
    left: 8px;
    top: -8px;
    font-size: 11px;
    color: #6b6e79;
    background: #1c1f27;
    padding: 0 4px;
  }
  .nowLine {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid #ff5f5f;
    z-index: 5;
  }
  .nowLine::before {
    content: "";
    position: absolute;
    left: 58px;
    top: -4px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff5f5f;
  }
  .nowLabel {
    position: absolute;
    right: 8px;
    top: -9px;
    font-size: 11px;
    color: #ff5f5f;
    font-weight: 700;
    background: #1c1f27;
    padding: 0 4px;
  }

  .block {
    position: absolute;
    left: 60px;
    right: 10px;
    border-radius: 6px;
    padding: 4px 8px;
    overflow: hidden;
    color: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    cursor: default;
  }
  .block.active { outline: 2px solid #7ee08b; outline-offset: -2px; }
  .block .blockLabel { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .block .blockTime { font-size: 10.5px; opacity: .85; }
  .block .blockDel {
    position: absolute;
    top: 2px; right: 4px;
    background: rgba(0,0,0,.25);
    border: none;
    color: white;
    width: 18px; height: 18px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .block .blockDel:hover { background: rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dagens tidslinje</h1>
    <div id="clock">--:--:--</div>
  </header>

  <div class="addBar">
    <input id="taskInput" type="text" placeholder="t.ex. 8-10 exjobb  ·  eller  exjobb 2h" autocomplete="off" />
    <button id="addBtn">Lägg till</button>
  </div>
  <div id="inputError" class="error"></div>
  <div class="hint">Skriv <code>8-10 exjobb</code> för en exakt tid, eller <code>exjobb 2h</code> för att starta direkt efter senaste blocket.</div>

  <div class="statusRow">
    <div class="statusCard" id="nowCard">
      <span class="label">Nu</span>
      <span id="nowText">–</span>
    </div>
    <div class="statusCard">
      <span class="label">Nästa</span>
      <span id="nextText">–</span>
    </div>
    <button id="notifBtn" class="ghost">🔔 Aktivera notiser</button>
    <button id="clearBtn" class="ghost danger">Rensa dagen</button>
  </div>

  <div id="alarmBanner" class="alarmBanner hidden">
    <span id="alarmText"></span>
    <button id="alarmDismiss">Stäng</button>
  </div>

  <div class="timelineScroll" id="timelineScroll">
    <div class="timelineTrack" id="timelineTrack">
      <div id="hourLines"></div>
      <div id="blocksLayer"></div>
      <div class="nowLine" id="nowLine"><span class="nowLabel" id="nowLabel"></span></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const PX_PER_HOUR = 70;
  const TRACK_HEIGHT = PX_PER_HOUR * 24;

  const el = (id) => document.getElementById(id);
  const taskInput = el("taskInput");
  const addBtn = el("addBtn");
  const inputError = el("inputError");
  const nowText = el("nowText");
  const nextText = el("nextText");
  const notifBtn = el("notifBtn");
  const clearBtn = el("clearBtn");
  const alarmBanner = el("alarmBanner");
  const alarmText = el("alarmText");
  const alarmDismiss = el("alarmDismiss");
  const timelineScroll = el("timelineScroll");
  const timelineTrack = el("timelineTrack");
  const hourLines = el("hourLines");
  const blocksLayer = el("blocksLayer");
  const nowLine = el("nowLine");
  const nowLabel = el("nowLabel");
  const clockEl = el("clock");

  timelineTrack.style.height = TRACK_HEIGHT + "px";

  // ---------- date / storage ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  let currentDayKey = todayKey();
  function storageKey() { return "claude-timeline-" + currentDayKey; }

  let blocks = [];
  function loadBlocks() {
    try {
      blocks = JSON.parse(localStorage.getItem(storageKey())) || [];
    } catch (e) {
      blocks = [];
    }
  }
  function saveBlocks() {
    localStorage.setItem(storageKey(), JSON.stringify(blocks));
  }

  // ---------- time helpers ----------
  function currentMinutesInt() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function fmtHM(min) {
    min = Math.round(min) % 1440;
    if (min < 0) min += 1440;
    const h = Math.floor(min / 60);
    const m = min % 60;
    return pad(h) + ":" + pad(m);
  }
  function fmtRange(b) { return fmtHM(b.start) + "–" + fmtHM(b.end); }

  function parseTimeToken(tok) {
    const m = tok.match(/^(\d{1,2})(?:[:.](\d{2}))?$/);
    if (!m) return null;
    const h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    if (h === 24) return (!m[2] || min === 0) ? 1440 : null;
    if (h > 23 || min > 59) return null;
    return h * 60 + min;
  }

  function roundUpTo5(min) { return Math.ceil(min / 5) * 5; }

  function nextFreeSlotStart() {
    const now = currentMinutesInt();
    if (blocks.length === 0) return roundUpTo5(now);
    const lastEnd = blocks.reduce((max, b) => Math.max(max, b.end), 0);
    return lastEnd > now ? lastEnd : roundUpTo5(now);
  }

  function parseInput(raw) {
    const text = raw.trim();
    if (!text) return { error: "Skriv något först." };

    // "8-10 exjobb" eller "8:30-10:00 exjobb"
    let m = text.match(/^(\d{1,2}(?:[:.]\d{2})?)\s*[-–]\s*(\d{1,2}(?:[:.]\d{2})?)\s+(.+)$/);
    if (m) {
      const start = parseTimeToken(m[1]);
      const end = parseTimeToken(m[2]);
      const label = m[3].trim();
      if (start === null || end === null) return { error: "Kunde inte tolka tiderna." };
      if (end <= start) return { error: "Sluttid måste vara efter starttid." };
      if (!label) return { error: "Skriv vad du ska göra." };
      return { start, end, label };
    }

    // "exjobb 8-10" (tid sist)
    m = text.match(/^(.+?)\s+(\d{1,2}(?:[:.]\d{2})?)\s*[-–]\s*(\d{1,2}(?:[:.]\d{2})?)$/);
    if (m) {
      const label = m[1].trim();
      const start = parseTimeToken(m[2]);
      const end = parseTimeToken(m[3]);
      if (start === null || end === null) return { error: "Kunde inte tolka tiderna." };
      if (end <= start) return { error: "Sluttid måste vara efter starttid." };
      return { start, end, label };
    }

    // "exjobb 1h30m" / "exjobb 1.5h" / "exjobb 2 tim"
    m = text.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:h|tim|timme|timmar)\s*(?:(\d{1,3})\s*m(?:in)?)?\s*$/i);
    if (m) {
      const label = m[1].trim();
      const hours = parseFloat(m[2].replace(",", "."));
      const extraMin = m[3] ? parseInt(m[3], 10) : 0;
      const duration = Math.round(hours * 60) + extraMin;
      if (!label) return { error: "Skriv vad du ska göra." };
      if (duration <= 0) return { error: "Längden måste vara mer än 0." };
      const start = nextFreeSlotStart();
      return { start, end: start + duration, label };
    }

    // "exjobb 90m" / "exjobb 45 min"
    m = text.match(/^(.+?)\s+(\d{1,3})\s*m(?:in(?:uter)?)?\s*$/i);
    if (m) {
      const label = m[1].trim();
      const duration = parseInt(m[2], 10);
      if (!label) return { error: "Skriv vad du ska göra." };
      if (duration <= 0) return { error: "Längden måste vara mer än 0." };
      const start = nextFreeSlotStart();
      return { start, end: start + duration, label };
    }

    return { error: 'Format: "8-10 exjobb" eller "exjobb 2h"' };
  }

  function overlaps(a, b) { return a.start < b.end && b.start < a.end; }

  // ---------- rendering ----------
  function buildHourLines() {
    hourLines.innerHTML = "";
    for (let h = 0; h <= 24; h++) {
      const row = document.createElement("div");
      row.className = "hourLine";
      row.style.top = h * PX_PER_HOUR + "px";
      if (h < 24) {
        const label = document.createElement("span");
        label.className = "hourLabel";
        label.textContent = pad(h) + ":00";
        row.appendChild(label);
      }
      hourLines.appendChild(row);
    }
  }

  function colorForLabel(label) {
    let hash = 0;
    for (let i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) >>> 0;
    const hue = hash % 360;
    return `hsl(${hue} 60% 40%)`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function render() {
    blocksLayer.innerHTML = "";
    for (const b of blocks) {
      const top = b.start * (PX_PER_HOUR / 60);
      const height = Math.max(18, (b.end - b.start) * (PX_PER_HOUR / 60) - 2);
      const div = document.createElement("div");
      div.className = "block";
      div.dataset.id = b.id;
      div.style.top = top + "px";
      div.style.height = height + "px";
      div.style.background = colorForLabel(b.label);
      div.innerHTML =
        `<button class="blockDel" title="Ta bort">×</button>` +
        `<div class="blockLabel">${escapeHtml(b.label)}</div>` +
        `<div class="blockTime">${fmtRange(b)}</div>`;
      div.querySelector(".blockDel").addEventListener("click", (e) => {
        e.stopPropagation();
        blocks = blocks.filter((x) => x.id !== b.id);
        saveBlocks();
        render();
        scheduleAlarms();
        updateNowNext();
      });
      blocksLayer.appendChild(div);
    }
    updateNowNext();
  }

  function updateNowLine() {
    const d = new Date();
    const min = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    nowLine.style.top = min * (PX_PER_HOUR / 60) + "px";
    nowLabel.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function updateNowNext() {
    const now = currentMinutesInt();
    const cur = blocks.find((b) => b.start <= now && now < b.end);
    const upcoming = blocks
      .filter((b) => b.start > now)
      .sort((a, b) => a.start - b.start)[0];

    nowText.textContent = cur ? `${cur.label} (till ${fmtHM(cur.end)})` : "Inget inplanerat just nu";
    nextText.textContent = upcoming
      ? `${upcoming.label} kl ${fmtHM(upcoming.start)}`
      : (blocks.length ? "Inget mer idag" : "Lägg till ditt första block");

    document.querySelectorAll(".block").forEach((elm) => elm.classList.remove("active"));
    if (cur) {
      const activeEl = blocksLayer.querySelector(`[data-id="${cur.id}"]`);
      if (activeEl) activeEl.classList.add("active");
    }
  }

  // ---------- alarms ----------
  let alarmTimers = [];
  function scheduleAlarms() {
    alarmTimers.forEach((t) => clearTimeout(t));
    alarmTimers = [];
    const now = new Date();
    const boundaries = [...new Set(blocks.map((b) => b.end))];
    for (const boundary of boundaries) {
      const target = new Date();
      target.setHours(Math.floor(boundary / 60), boundary % 60, 0, 0);
      if (boundary >= 1440) target.setDate(target.getDate() + Math.floor(boundary / 1440));
      const delayMs = target - now;
      if (delayMs <= 0) continue;
      const id = setTimeout(() => fireAlarm(boundary), delayMs);
      alarmTimers.push(id);
    }
  }

  function fireAlarm(boundary) {
    const next = blocks
      .filter((b) => b.start === boundary)
      .sort((a, b) => a.start - b.start)[0];
    const msg = next
      ? `Dags att byta! Nästa: ${next.label} (${fmtRange(next)})`
      : "Blocket är klart — bestäm nästa grej!";
    showAlarmBanner(msg);
    playBeep();
    sendDesktopNotification("Dagens tidslinje", msg);
    updateNowNext();
  }

  function showAlarmBanner(msg) {
    alarmText.textContent = msg;
    alarmBanner.classList.remove("hidden");
  }
  alarmDismiss.addEventListener("click", () => alarmBanner.classList.add("hidden"));

  // ---------- audio ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function playBeep() {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t0 = now + i * 0.35;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    }
  }

  // ---------- desktop notifications ----------
  function updateNotifBtn() {
    if (!("Notification" in window)) {
      notifBtn.textContent = "🔕 Notiser stöds ej";
      notifBtn.disabled = true;
      return;
    }
    if (Notification.permission === "granted") notifBtn.textContent = "🔔 Notiser: På";
    else if (Notification.permission === "denied") notifBtn.textContent = "🔕 Notiser blockerade";
    else notifBtn.textContent = "🔔 Aktivera notiser";
  }
  notifBtn.addEventListener("click", () => {
    ensureAudio();
    if (!("Notification" in window)) return;
    Notification.requestPermission().then(updateNotifBtn);
  });
  function sendDesktopNotification(title, body) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body }); } catch (e) { /* ignore */ }
  }

  // ---------- input handling ----------
  function showInputError(msg) {
    inputError.textContent = msg;
    inputError.classList.add("show");
    clearTimeout(showInputError._t);
    showInputError._t = setTimeout(() => inputError.classList.remove("show"), 4000);
  }
  function clearInputError() {
    inputError.textContent = "";
    inputError.classList.remove("show");
  }

  function addBlock() {
    ensureAudio();
    const parsed = parseInput(taskInput.value);
    if (parsed.error) { showInputError(parsed.error); return; }
    let { start, end, label } = parsed;
    end = Math.min(end, 1440);
    if (end <= start) { showInputError("Sluttid måste vara efter starttid."); return; }

    const candidate = { start, end, label };
    const conflict = blocks.find((b) => overlaps(b, candidate));
    if (conflict) {
      showInputError(`Överlappar med "${conflict.label}" (${fmtRange(conflict)})`);
      return;
    }

    candidate.id = (crypto.randomUUID ? crypto.randomUUID() : "b" + Date.now() + Math.random());
    blocks.push(candidate);
    blocks.sort((a, b) => a.start - b.start);
    saveBlocks();
    render();
    scheduleAlarms();
    clearInputError();
    taskInput.value = "";
    taskInput.focus();
  }

  addBtn.addEventListener("click", addBlock);
  taskInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addBlock(); });

  clearBtn.addEventListener("click", () => {
    if (!confirm("Rensa alla block för idag?")) return;
    blocks = [];
    saveBlocks();
    render();
    scheduleAlarms();
  });

  // ---------- day rollover ----------
  setInterval(() => {
    if (todayKey() !== currentDayKey) location.reload();
  }, 30000);

  // ---------- init ----------
  buildHourLines();
  loadBlocks();
  render();
  scheduleAlarms();
  updateNotifBtn();
  updateNowLine();
  setInterval(updateNowLine, 1000);
  setInterval(updateNowNext, 15000);

  requestAnimationFrame(() => {
    const nowTop = currentMinutesInt() * (PX_PER_HOUR / 60);
    timelineScroll.scrollTop = Math.max(0, nowTop - 100);
  });
})();
</script>
</body>
</html>
