<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dagens tidslinje</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #14161c;
    color: #e8e8ec;
  }

  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 14px 18px 16px;
    gap: 10px;
  }

  .timelineCenter {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .topBar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    flex: 0 0 auto;
  }
  h1 { font-size: 18px; margin: 0; margin-right: 4px; white-space: nowrap; }
  #clock { font-variant-numeric: tabular-nums; font-size: 13px; color: #8a8d99; white-space: nowrap; }

  .statusChip {
    background: #1c1f27;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    color: #b6b8c2;
    white-space: nowrap;
  }
  .statusChip b { color: #e8e8ec; font-weight: 600; }
  #nowChip b { color: #7ee08b; }

  .spacer { flex: 1 1 auto; }

  button.ghost {
    background: #1c1f27;
    color: #b6b8c2;
    border: 1px solid #303441;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.ghost:hover { background: #262a35; }
  button.ghost.danger:hover { background: #3a1f1f; color: #ff9a9a; }

  .controlsRow {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    flex-wrap: wrap;
  }
  .controlsRow input {
    background: #1c1f27;
    border: 1px solid #303441;
    color: #e8e8ec;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
  }
  #taskInput { flex: 2 1 220px; min-width: 140px; }
  #durationInput { flex: 1 1 130px; min-width: 100px; }
  .controlsRow input:focus { outline: none; border-color: #4c7cf0; }
  .controlsRow button.primary {
    background: #4c7cf0;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    height: 40px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .controlsRow button.primary:hover { background: #3f6ce0; }

  .error {
    font-size: 12.5px;
    color: #ff9a9a;
    opacity: 0;
    transition: opacity .15s;
    flex: 1 1 100%;
  }
  .error.show { opacity: 1; }

  .alarmBanner {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    max-width: min(90vw, 520px);
    display: flex;
    align-items: center;
    gap: 12px;
    background: #3a2f14;
    border: 1px solid #6b5420;
    color: #ffd98a;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .alarmBanner.hidden { display: none; animation: none; }
  .alarmBanner button {
    background: #6b5420;
    color: #ffe9b8;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 217, 138, .35); }
    50% { box-shadow: 0 0 0 6px rgba(255, 217, 138, 0); }
  }

  .timelineWrap {
    flex: 0 0 auto;
    width: 100%;
    height: 220px;
    background: #1c1f27;
    border: 1px solid #262a35;
    border-radius: 10px;
  }
  .trackOuter {
    height: 100%;
    overflow: hidden;
  }
  .trackInner {
    position: relative;
    height: 100%;
    width: 100%;
  }

  .ticksRow {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 26px;
    border-bottom: 1px solid #262a35;
  }
  .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    border-left: 1px solid #2c3040;
  }
  .tick.half { border-left: 1px dashed #23262f; }
  .tickLabel {
    position: absolute;
    top: 4px;
    left: 3px;
    font-size: 10px;
    color: #6b6e79;
    white-space: nowrap;
  }

  .blocksRow {
    position: absolute;
    top: 26px; left: 0; right: 0; bottom: 0;
  }
  .halfGrid {
    position: absolute;
    top: 0; bottom: 0; width: 0;
    border-left: 1px dashed #23262f;
  }
  .hourGrid {
    position: absolute;
    top: 0; bottom: 0; width: 0;
    border-left: 1px solid #262a35;
  }

  .nowLine {
    position: absolute;
    top: 0; bottom: 0;
    width: 0;
    border-left: 2px solid #ff5f5f;
    z-index: 6;
    pointer-events: none;
  }
  .nowLine::after {
    content: "";
    position: absolute;
    top: -4px; left: -4px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff5f5f;
  }
  .nowLabel {
    position: absolute;
    top: 2px;
    left: 6px;
    font-size: 10.5px;
    font-weight: 700;
    color: #ff5f5f;
    background: #1c1f27;
    padding: 0 3px;
    white-space: nowrap;
  }

  .block {
    position: absolute;
    top: 10px;
    bottom: 10px;
    border-radius: 8px;
    padding: 6px 8px;
    overflow: hidden;
    color: white;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    cursor: grab;
    user-select: none;
    touch-action: none;
    transition: left .15s ease, box-shadow .15s;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .block.dragging {
    transition: none;
    cursor: grabbing;
    z-index: 10;
    box-shadow: 0 6px 18px rgba(0,0,0,.55);
  }
  .block.active { outline: 2px solid #7ee08b; outline-offset: -2px; }
  .block.locked { cursor: default; }
  .block.shake { animation: shake .3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .block .blockLabel { font-size: 13px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block .blockTime { font-size: 10.5px; opacity: .85; white-space: nowrap; }
  .block .blockDel, .block .blockLock {
    position: absolute;
    top: 2px;
    background: rgba(0,0,0,.25);
    border: none;
    color: white;
    width: 18px; height: 18px;
    border-radius: 4px;
    font-size: 11px;
    line-height: 18px;
    padding: 0;
    cursor: pointer;
  }
  .block .blockDel { right: 2px; font-size: 13px; }
  .block .blockLock { right: 22px; }
  .block .blockDel:hover, .block .blockLock:hover { background: rgba(0,0,0,.5); }
  .block .blockLock.on { background: rgba(255,217,138,.35); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topBar">
    <h1>Dagens tidslinje</h1>
    <div id="clock">--:--:--</div>
    <div class="statusChip" id="nowChip">Nu: <b id="nowText">–</b></div>
    <div class="statusChip">Nästa: <b id="nextText">–</b></div>
    <div class="spacer"></div>
    <button id="notifBtn" class="ghost">🔔 Aktivera notiser</button>
    <button id="clearBtn" class="ghost danger">Rensa dagen</button>
  </div>

  <div class="controlsRow">
    <input id="taskInput" type="text" placeholder="Vad ska du göra? t.ex. Exjobb" autocomplete="off" />
    <input id="durationInput" type="text" placeholder="Hur länge? t.ex. 2h eller 45m" autocomplete="off" />
    <button id="addBtn" class="primary">Lägg till</button>
    <span id="inputError" class="error"></span>
  </div>

  <div class="timelineCenter">
    <div class="timelineWrap">
      <div class="trackOuter" id="trackOuter">
        <div class="trackInner" id="trackInner">
          <div class="ticksRow" id="ticksRow"></div>
          <div class="blocksRow" id="blocksRow"></div>
          <div class="nowLine" id="nowLine"><span class="nowLabel" id="nowLabel"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="alarmBanner" class="alarmBanner hidden">
  <span id="alarmText"></span>
  <button id="alarmDismiss">Stäng</button>
</div>

<script>
(function () {
  "use strict";

  const SNAP_MIN = 30;

  const el = (id) => document.getElementById(id);
  const taskInput = el("taskInput");
  const durationInput = el("durationInput");
  const addBtn = el("addBtn");
  const inputError = el("inputError");
  const nowText = el("nowText");
  const nextText = el("nextText");
  const notifBtn = el("notifBtn");
  const clearBtn = el("clearBtn");
  const alarmBanner = el("alarmBanner");
  const alarmText = el("alarmText");
  const alarmDismiss = el("alarmDismiss");
  const trackOuter = el("trackOuter");
  const trackInner = el("trackInner");
  const ticksRow = el("ticksRow");
  const blocksRow = el("blocksRow");
  const nowLine = el("nowLine");
  const nowLabel = el("nowLabel");
  const clockEl = el("clock");

  let pxPerMin = 1;

  // ---------- date / storage ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  let currentDayKey = todayKey();
  function storageKey() { return "claude-timeline-" + currentDayKey; }

  let blocks = [];
  function loadBlocks() {
    try { blocks = JSON.parse(localStorage.getItem(storageKey())) || []; }
    catch (e) { blocks = []; }
  }
  function saveBlocks() { localStorage.setItem(storageKey(), JSON.stringify(blocks)); }

  // ---------- time helpers ----------
  function currentMinutesInt() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function fmtHM(min) {
    min = Math.round(min) % 1440;
    if (min < 0) min += 1440;
    return pad(Math.floor(min / 60)) + ":" + pad(min % 60);
  }
  function fmtRange(b) { return fmtHM(b.start) + "–" + fmtHM(b.end); }
  function genId() { return crypto.randomUUID ? crypto.randomUUID() : "b" + Date.now() + Math.random(); }

  function roundUpTo5(min) { return Math.ceil(min / 5) * 5; }
  function nextFreeSlotStart() {
    const now = currentMinutesInt();
    if (blocks.length === 0) return roundUpTo5(now);
    const lastEnd = blocks.reduce((max, b) => Math.max(max, b.end), 0);
    return lastEnd > now ? lastEnd : roundUpTo5(now);
  }

  function parseDuration(raw) {
    const text = raw.trim();
    if (!text) return null;
    let m = text.match(/^(\d+(?:[.,]\d+)?)\s*(?:h|tim|timme|timmar)\s*(?:(\d{1,3})\s*m(?:in)?)?$/i);
    if (m) {
      const hours = parseFloat(m[1].replace(",", "."));
      const extraMin = m[2] ? parseInt(m[2], 10) : 0;
      return Math.round(hours * 60) + extraMin;
    }
    m = text.match(/^(\d{1,3})\s*m(?:in(?:uter)?)?$/i);
    if (m) return parseInt(m[1], 10);
    return null;
  }

  function overlaps(a, b) { return a.start < b.end && b.start < a.end; }

  // ---------- layout ----------
  function computeLayout() {
    pxPerMin = trackOuter.clientWidth / 1440;
  }

  function buildTicks() {
    ticksRow.innerHTML = "";
    for (let h = 0; h <= 24; h++) {
      const x = h * 60 * pxPerMin;
      const tick = document.createElement("div");
      tick.className = "tick";
      tick.style.left = x + "px";
      if (h < 24) {
        const label = document.createElement("span");
        label.className = "tickLabel";
        label.textContent = pad(h) + ":00";
        tick.appendChild(label);
      }
      ticksRow.appendChild(tick);

      if (h < 24) {
        const half = document.createElement("div");
        half.className = "tick half";
        half.style.left = (x + 30 * pxPerMin) + "px";
        ticksRow.appendChild(half);
      }
    }

    // grid lines behind blocks
    const oldGrid = blocksRow.querySelectorAll(".hourGrid, .halfGrid");
    oldGrid.forEach((g) => g.remove());
    for (let h = 0; h <= 24; h++) {
      const x = h * 60 * pxPerMin;
      const grid = document.createElement("div");
      grid.className = "hourGrid";
      grid.style.left = x + "px";
      blocksRow.appendChild(grid);
      if (h < 24) {
        const halfGrid = document.createElement("div");
        halfGrid.className = "halfGrid";
        halfGrid.style.left = (x + 30 * pxPerMin) + "px";
        blocksRow.appendChild(halfGrid);
      }
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function colorForLabel(label) {
    let hash = 0;
    for (let i = 0; i < label.length; i++) hash = (hash * 31 + label.charCodeAt(i)) >>> 0;
    return `hsl(${hash % 360} 60% 40%)`;
  }

  // ---------- rendering ----------
  function render() {
    blocksRow.querySelectorAll(".block").forEach((b) => b.remove());
    for (const b of blocks) {
      const left = b.start * pxPerMin;
      const width = Math.max(8, (b.end - b.start) * pxPerMin - 2);
      const div = document.createElement("div");
      div.className = "block" + (b.locked ? " locked" : "");
      div.dataset.id = b.id;
      div.style.left = left + "px";
      div.style.width = width + "px";
      div.style.background = colorForLabel(b.label);
      div.title = `${b.label} (${fmtRange(b)})${b.locked ? " — låst" : ""}`;
      div.innerHTML =
        `<button class="blockDel" title="Ta bort">×</button>` +
        `<button class="blockLock${b.locked ? " on" : ""}" title="${b.locked ? "Lås upp" : "Lås"}">${b.locked ? "\u{1F512}" : "\u{1F513}"}</button>` +
        `<div class="blockLabel">${escapeHtml(b.label)}</div>` +
        `<div class="blockTime">${fmtRange(b)}</div>`;
      div.querySelector(".blockDel").addEventListener("pointerdown", (e) => e.stopPropagation());
      div.querySelector(".blockDel").addEventListener("click", (e) => {
        e.stopPropagation();
        blocks = blocks.filter((x) => x.id !== b.id);
        saveBlocks();
        render();
        scheduleAlarms();
        updateNowNext();
      });
      div.querySelector(".blockLock").addEventListener("pointerdown", (e) => e.stopPropagation());
      div.querySelector(".blockLock").addEventListener("click", (e) => {
        e.stopPropagation();
        const target = blocks.find((x) => x.id === b.id);
        target.locked = !target.locked;
        saveBlocks();
        render();
      });
      attachDrag(div, b);
      blocksRow.appendChild(div);
    }
    updateNowNext();
  }

  // ---------- drag & drop ----------
  function attachDrag(div, block) {
    div.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".blockDel") || e.target.closest(".blockLock")) return;
      if (block.locked) {
        div.classList.remove("shake");
        void div.offsetWidth;
        div.classList.add("shake");
        return;
      }
      e.preventDefault();
      div.setPointerCapture(e.pointerId);

      const duration = block.end - block.start;
      const originalStart = block.start;
      const startX = e.clientX;
      let pendingStart = originalStart;
      let cancelled = false;

      div.classList.add("dragging");

      function clampStart(s) {
        return Math.max(0, Math.min(1440 - duration, s));
      }

      function onMove(ev) {
        const dx = ev.clientX - startX;
        let s = originalStart + dx / pxPerMin;
        if (ev.shiftKey) s = Math.round(s / SNAP_MIN) * SNAP_MIN;
        s = clampStart(s);
        pendingStart = s;
        div.style.left = (s * pxPerMin) + "px";
        div.querySelector(".blockTime").textContent = fmtRange({ start: s, end: s + duration });
      }

      function onKeyDown(ev) {
        if (ev.key === "Escape") { cancelled = true; finish(); }
      }

      function finish() {
        div.releasePointerCapture(e.pointerId);
        div.removeEventListener("pointermove", onMove);
        div.removeEventListener("pointerup", onUp);
        window.removeEventListener("keydown", onKeyDown);
        div.classList.remove("dragging");

        if (cancelled) { render(); return; }

        const newStart = Math.round(pendingStart);
        const newEnd = newStart + duration;
        const conflict = blocks.find((b) => b.id !== block.id && overlaps(b, { start: newStart, end: newEnd }));
        if (conflict) {
          showInputError(`Kan inte placera där – överlappar med "${conflict.label}".`);
          render();
          return;
        }
        const target = blocks.find((b) => b.id === block.id);
        target.start = newStart;
        target.end = newEnd;
        blocks.sort((a, b) => a.start - b.start);
        saveBlocks();
        render();
        scheduleAlarms();
      }

      function onUp() { finish(); }

      div.addEventListener("pointermove", onMove);
      div.addEventListener("pointerup", onUp);
      window.addEventListener("keydown", onKeyDown);
    });
  }

  function updateNowLine() {
    const d = new Date();
    const min = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
    nowLine.style.left = (min * pxPerMin) + "px";
    nowLabel.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    clockEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function updateNowNext() {
    const now = currentMinutesInt();
    const cur = blocks.find((b) => b.start <= now && now < b.end);
    const upcoming = blocks.filter((b) => b.start > now).sort((a, b) => a.start - b.start)[0];

    nowText.textContent = cur ? `${cur.label} (till ${fmtHM(cur.end)})` : "Inget just nu";
    nextText.textContent = upcoming
      ? `${upcoming.label} kl ${fmtHM(upcoming.start)}`
      : (blocks.length ? "Inget mer idag" : "Lägg till ditt första block");

    document.querySelectorAll(".block").forEach((elm) => elm.classList.remove("active"));
    if (cur) {
      const activeEl = blocksRow.querySelector(`[data-id="${cur.id}"]`);
      if (activeEl) activeEl.classList.add("active");
    }
  }

  // ---------- alarms ----------
  let alarmTimers = [];
  function scheduleAlarms() {
    alarmTimers.forEach((t) => clearTimeout(t));
    alarmTimers = [];
    const now = new Date();
    const boundaries = [...new Set(blocks.map((b) => b.end))];
    for (const boundary of boundaries) {
      const target = new Date();
      target.setHours(Math.floor(boundary / 60), boundary % 60, 0, 0);
      if (boundary >= 1440) target.setDate(target.getDate() + Math.floor(boundary / 1440));
      const delayMs = target - now;
      if (delayMs <= 0) continue;
      alarmTimers.push(setTimeout(() => fireAlarm(boundary), delayMs));
    }
  }

  function fireAlarm(boundary) {
    const next = blocks.filter((b) => b.start === boundary).sort((a, b) => a.start - b.start)[0];
    const msg = next
      ? `Dags att byta! Nästa: ${next.label} (${fmtRange(next)})`
      : "Blocket är klart — bestäm nästa grej!";
    showAlarmBanner(msg);
    playBeep();
    sendDesktopNotification("Dagens tidslinje", msg);
    updateNowNext();
  }

  function showAlarmBanner(msg) {
    alarmText.textContent = msg;
    alarmBanner.classList.remove("hidden");
  }
  alarmDismiss.addEventListener("click", () => alarmBanner.classList.add("hidden"));

  // ---------- audio ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  function playBeep() {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t0 = now + i * 0.35;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    }
  }

  // ---------- desktop notifications ----------
  function updateNotifBtn() {
    if (!("Notification" in window)) {
      notifBtn.textContent = "🔕 Notiser stöds ej";
      notifBtn.disabled = true;
      return;
    }
    if (Notification.permission === "granted") notifBtn.textContent = "🔔 Notiser: På";
    else if (Notification.permission === "denied") notifBtn.textContent = "🔕 Notiser blockerade";
    else notifBtn.textContent = "🔔 Aktivera notiser";
  }
  notifBtn.addEventListener("click", () => {
    ensureAudio();
    if (!("Notification" in window)) return;
    Notification.requestPermission().then(updateNotifBtn);
  });
  function sendDesktopNotification(title, body) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body }); } catch (e) { /* ignore */ }
  }

  // ---------- input handling ----------
  function showInputError(msg) {
    inputError.textContent = msg;
    inputError.classList.add("show");
    clearTimeout(showInputError._t);
    showInputError._t = setTimeout(() => inputError.classList.remove("show"), 4000);
  }
  function clearInputError() {
    inputError.textContent = "";
    inputError.classList.remove("show");
  }

  function addBlock() {
    ensureAudio();
    const label = taskInput.value.trim();
    if (!label) { showInputError("Skriv vad du ska göra."); taskInput.focus(); return; }
    const minutes = parseDuration(durationInput.value);
    if (minutes === null || minutes <= 0) {
      showInputError('Ange längd, t.ex. "2h" eller "45m".');
      durationInput.focus();
      return;
    }
    const start = nextFreeSlotStart();
    const end = Math.min(start + minutes, 1440);
    if (end <= start) { showInputError("Dagen är redan full."); return; }

    const candidate = { start, end, label, id: genId() };
    const conflict = blocks.find((b) => overlaps(b, candidate));
    if (conflict) {
      showInputError(`Dagen är full efter kl ${fmtHM(conflict.end)}.`);
      return;
    }

    blocks.push(candidate);
    blocks.sort((a, b) => a.start - b.start);
    saveBlocks();
    render();
    scheduleAlarms();
    clearInputError();
    taskInput.value = "";
    durationInput.value = "";
    taskInput.focus();
  }

  addBtn.addEventListener("click", addBlock);
  taskInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addBlock(); });
  durationInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addBlock(); });

  clearBtn.addEventListener("click", () => {
    if (!confirm("Rensa alla block för idag?")) return;
    blocks = [];
    saveBlocks();
    render();
    scheduleAlarms();
  });

  // ---------- day rollover ----------
  setInterval(() => {
    if (todayKey() !== currentDayKey) location.reload();
  }, 30000);

  // ---------- resize ----------
  function relayout() {
    computeLayout();
    buildTicks();
    render();
    updateNowLine();
  }
  window.addEventListener("resize", relayout);
  if (window.ResizeObserver) {
    new ResizeObserver(relayout).observe(trackOuter);
  }

  // ---------- init ----------
  computeLayout();
  buildTicks();
  loadBlocks();
  render();
  scheduleAlarms();
  updateNotifBtn();
  updateNowLine();
  setInterval(updateNowLine, 1000);
  setInterval(updateNowNext, 15000);
})();
</script>
</body>
</html>
