<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
      color: #e94560;
    }

    .status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      height: 1.6rem;
      color: #a8dadc;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 18px rgba(232, 69, 96, 0.6);
    }

    .cell.o.win {
      box-shadow: 0 0 18px rgba(168, 218, 220, 0.6);
    }

    .controls {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.04); }

    #restart {
      background: #e94560;
      color: #fff;
    }

    #mode-toggle {
      background: #0f3460;
      color: #a8dadc;
      border: 2px solid #a8dadc;
    }

    .score {
      margin-top: 1.5rem;
      display: flex;
      gap: 2rem;
      font-size: 1rem;
      color: #aaa;
    }

    .score span { text-align: center; }
    .score strong { display: block; font-size: 1.6rem; color: #eee; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="status" id="status">X's turn</div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button id="restart">Restart</button>
    <button id="mode-toggle">vs Computer</button>
  </div>
  <div class="score">
    <span><strong id="score-x">0</strong>X wins</span>
    <span><strong id="score-tie">0</strong>Ties</span>
    <span><strong id="score-o">0</strong>O wins</span>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board, current, gameOver, vsComputer;
    let scores = { X: 0, O: 0, tie: 0 };

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');
    const modeBtn = document.getElementById('mode-toggle');

    vsComputer = false;

    function init() {
      board = Array(9).fill('');
      current = 'X';
      gameOver = false;
      statusEl.textContent = "X's turn";
      renderBoard();
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      board.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (val ? ' ' + val.toLowerCase() + ' taken' : '');
        cell.textContent = val;
        cell.addEventListener('click', () => handleClick(i));
        boardEl.appendChild(cell);
      });
    }

    function handleClick(i) {
      if (gameOver || board[i]) return;
      if (vsComputer && current === 'O') return;
      play(i);
      if (vsComputer && !gameOver && current === 'O') {
        setTimeout(computerMove, 350);
      }
    }

    function play(i) {
      board[i] = current;
      const result = checkResult();
      renderBoard();
      if (result === 'win') {
        highlightWin();
        statusEl.textContent = `${current} wins!`;
        scores[current]++;
        updateScore();
        gameOver = true;
      } else if (result === 'tie') {
        statusEl.textContent = "It's a tie!";
        scores.tie++;
        updateScore();
        gameOver = true;
      } else {
        current = current === 'X' ? 'O' : 'X';
        statusEl.textContent = `${current}'s turn`;
      }
    }

    function checkResult() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) return 'win';
      }
      return board.every(Boolean) ? 'tie' : null;
    }

    function highlightWin() {
      const cells = boardEl.querySelectorAll('.cell');
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
          [a, b, c].forEach(i => cells[i].classList.add('win'));
          break;
        }
      }
    }

    function computerMove() {
      const move = bestMove();
      play(move);
    }

    function bestMove() {
      // Try to win
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          if (checkResult() === 'win') { board[i] = ''; return i; }
          board[i] = '';
        }
      }
      // Block X from winning
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'X';
          if (checkResult() === 'win') { board[i] = ''; return i; }
          board[i] = '';
        }
      }
      // Prefer center, then corners, then edges
      const order = [4, 0, 2, 6, 8, 1, 3, 5, 7];
      return order.find(i => !board[i]);
    }

    function updateScore() {
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-tie').textContent = scores.tie;
    }

    restartBtn.addEventListener('click', init);

    modeBtn.addEventListener('click', () => {
      vsComputer = !vsComputer;
      modeBtn.textContent = vsComputer ? 'vs Human' : 'vs Computer';
      scores = { X: 0, O: 0, tie: 0 };
      updateScore();
      init();
    });

    init();
  </script>
</body>
</html>
