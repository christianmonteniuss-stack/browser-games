<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Turn off blocking — ClaudeFocus</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { max-width: 420px; margin: 60px auto; }
    h1 { font-size: 18px; text-align: center; }
    p.sub { text-align: center; color: #b6b8c2; font-size: 13px; margin-top: -6px; }
    .problem { display: flex; align-items: center; justify-content: space-between;
      background: #1c1f27; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .problem span { font-size: 15px; }
    .problem input { width: 90px; text-align: right; }
    #msg { text-align: center; font-size: 13px; min-height: 18px; margin: 10px 0; }
    #msg.error { color: #ff9a9a; }
    #msg.ok { color: #7ee08b; }
  </style>
</head>
<body>
  <h1>Solve to turn off blocking</h1>
  <p class="sub">All answers must be correct. Getting one wrong generates a new set.</p>

  <div id="problems"></div>
  <div id="msg"></div>

  <button id="submitBtn" class="primary">Submit</button>
  <button id="cancelBtn" class="secondary">Cancel</button>

  <script src="common.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
