<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Blocked — ClaudeFocus</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { max-width: 480px; margin: 60px auto; text-align: center; }
    .icon { font-size: 40px; margin-bottom: 8px; }
    h1 { font-size: 20px; }
    #site { color: #ff8080; font-weight: 700; }
    #count { margin: 18px 0; font-size: 13px; color: #b6b8c2; }
    #count strong { color: #e8e8ec; font-size: 18px; }
    .btnrow { max-width: 260px; margin: 24px auto 0; }
  </style>
</head>
<body>
  <div class="icon">🚫</div>
  <h1>Blocked: <span id="site"></span></h1>
  <p>This site is on your ClaudeFocus blocklist while blocking is turned on.</p>
  <div id="count">You've tried to visit this site <strong id="attemptCount">0</strong> time(s).</div>
  <div class="btnrow">
    <button id="backBtn" class="secondary">Go back</button>
    <button id="unlockBtn" class="danger">Turn off blocking (solve math)</button>
  </div>

  <script src="common.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
